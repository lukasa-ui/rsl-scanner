[theme]
base = "light"
primaryColor = "#0F6B4F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F1F5F3"
textColor = "#1C2724"
borderColor = "#DCE5E0"
linkColor = "#0F6B4F"
dataframeHeaderBackgroundColor = "#F1F5F3"
baseRadius = "small"
showWidgetBorder = true
font = "Barlow:https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap, sans-serif"
headingFont = "Barlow Semi Condensed:https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&display=swap, sans-serif"
headingFontWeights = [600, 600, 600, 500, 500, 500]
chartCategoricalColors = ["#1C2724", "#0F6B4F"]

[client]
toolbarMode = "minimal"
