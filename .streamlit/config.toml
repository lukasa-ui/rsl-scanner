[theme]
base = "light"
primaryColor = "#0071E3"
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
borderColor = "#D2D2D7"
linkColor = "#0066CC"
dataframeHeaderBackgroundColor = "#FAFAFC"
baseRadius = "medium"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 600, 600, 600, 600, 600]
chartCategoricalColors = ["#1D1D1F", "#0071E3"]

[client]
toolbarMode = "minimal"
